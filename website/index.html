<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/images/brand/favicon-180.png" />
    <title>16Dimensions | Behavioural Training & People Performance Solutions</title>
    <meta
      name="description"
      content="16Dimensions is a corporate training company in Chennai offering leadership, communication, customer experience, retail and hospitality training, and PoSH & ICC services."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" as="image" href="/images/brand/loader-mark.webp" />
    <link rel="preload" as="image" href="/images/brand/loader-word.webp" />
    <!-- Loading screen: inline so it paints before any CSS or JS arrives. -->
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 42%, rgba(149, 194, 75, 0.16), transparent 42%),
          radial-gradient(circle at 15% 85%, rgba(149, 194, 75, 0.08), transparent 35%),
          radial-gradient(circle at 85% 12%, rgba(149, 194, 75, 0.08), transparent 35%),
          #fff;
        transition: opacity 0.55s ease, visibility 0.55s ease;
      }
      #preloader.is-done {
        opacity: 0;
        visibility: hidden;
      }
      /* on exit the content zooms toward the viewer as the screen fades */
      .preloader__inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        transition: transform 0.55s cubic-bezier(0.7, 0, 0.84, 0), filter 0.55s ease;
      }
      #preloader.is-done .preloader__inner {
        transform: scale(1.12);
        filter: blur(4px);
      }
      .preloader__mark {
        position: relative;
        display: grid;
        place-items: center;
        width: 150px;
        height: 150px;
      }
      /* ripples radiating from the mark */
      .preloader__mark::before,
      .preloader__mark::after {
        content: '';
        position: absolute;
        inset: 18px;
        border-radius: 50%;
        border: 1.5px solid rgba(149, 194, 75, 0.45);
        animation: pl-ripple 2.4s cubic-bezier(0.2, 0.6, 0.35, 1) infinite;
      }
      .preloader__mark::after { animation-delay: 1.2s; }
      /* gradient comet ring with a glowing head */
      .preloader__ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(from 0deg, rgba(149, 194, 75, 0) 0 55%, rgba(149, 194, 75, 0.6) 85%, #95C24B);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2.5px));
        animation: pl-spin 1.3s linear infinite;
      }
      .preloader__dot {
        position: absolute;
        inset: 0;
        animation: pl-spin 1.3s linear infinite;
      }
      .preloader__dot::before {
        content: '';
        position: absolute;
        top: -2.5px;
        left: 50%;
        width: 8px;
        height: 8px;
        margin-left: -4px;
        border-radius: 50%;
        background: #95C24B;
        box-shadow: 0 0 10px 2px rgba(149, 194, 75, 0.7);
      }
      /* slower dashed inner orbit turning the other way */
      .preloader__orbit {
        position: absolute;
        inset: 14px;
        border-radius: 50%;
        border: 1.5px dashed rgba(149, 194, 75, 0.35);
        animation: pl-spin 6s linear infinite reverse;
      }
      /* images stay invisible until loaded, so no broken-image frame flashes */
      #preloader img {
        opacity: 0;
        transition: opacity 0.3s ease;
      }
      #preloader img.is-ready {
        opacity: 1;
      }
      .preloader__mark img {
        position: relative;
        width: 78px;
        height: auto;
        filter: drop-shadow(0 6px 14px rgba(149, 194, 75, 0.25));
      }
      .preloader__mark img.is-ready {
        animation: pl-pop 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) both, pl-float 3s ease-in-out 0.8s infinite;
      }
      /* wordmark rises in, then a light sweep glints across the letters */
      .preloader__word {
        position: relative;
        width: 230px;
      }
      .preloader__word img {
        display: block;
        width: 100%;
        height: auto;
      }
      .preloader__word img.is-ready {
        animation: pl-rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
      }
      .preloader__word::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, 0.9) 50%, transparent 60%) 200% 0 / 300% 100% no-repeat;
        /* clip the glint to the letter shapes */
        -webkit-mask: url(/images/brand/loader-word.webp) center / 100% 100% no-repeat;
        mask: url(/images/brand/loader-word.webp) center / 100% 100% no-repeat;
        animation: pl-shine 2.2s ease-in-out 0.9s infinite;
      }
      .preloader__bar {
        position: relative;
        width: 180px;
        height: 4px;
        border-radius: 4px;
        background: rgba(149, 194, 75, 0.12);
        overflow: hidden;
      }
      .preloader__bar::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 45%;
        border-radius: 4px;
        background: linear-gradient(90deg, rgba(149, 194, 75, 0), #95C24B 60%, #95C24B);
        box-shadow: 0 0 8px rgba(149, 194, 75, 0.6);
        animation: pl-bar 1.3s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }
      @keyframes pl-spin { to { transform: rotate(360deg); } }
      @keyframes pl-ripple {
        0% { transform: scale(0.85); opacity: 0.9; }
        100% { transform: scale(1.6); opacity: 0; }
      }
      @keyframes pl-pop {
        from { opacity: 0; transform: scale(0.4) rotate(-90deg); }
        to { opacity: 1; transform: none; }
      }
      @keyframes pl-float {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-5px) scale(1.04); }
      }
      @keyframes pl-rise {
        from { opacity: 0; transform: translateY(14px); filter: blur(6px); }
        to { opacity: 1; transform: none; filter: none; }
      }
      @keyframes pl-shine {
        0% { background-position: 150% 0; }
        60%, 100% { background-position: -50% 0; }
      }
      @keyframes pl-bar { from { transform: translateX(-100%); } to { transform: translateX(225%); } }
      @media (prefers-reduced-motion: reduce) {
        #preloader *, #preloader *::before, #preloader *::after { animation: none !important; }
        #preloader.is-done .preloader__inner { transform: none; filter: none; }
      }
    </style>
    <noscript><style>#preloader { display: none; }</style></noscript>
    <!--app-head-->
  </head>
  <body>
    <div id="preloader" role="status" aria-label="Loading 16Dimensions">
      <div class="preloader__inner">
        <div class="preloader__mark">
          <span class="preloader__orbit"></span>
          <span class="preloader__ring"></span>
          <span class="preloader__dot"></span>
          <img src="/images/brand/loader-mark.webp" alt="" width="173" height="192" onload="this.classList.add('is-ready')" />
        </div>
        <div class="preloader__word"><img src="/images/brand/loader-word.webp" alt="" width="638" height="142" onload="this.classList.add('is-ready')" /></div>
        <div class="preloader__bar"></div>
      </div>
    </div>
    <!-- Safety net: never leave the loader up if the app script fails. -->
    <script>setTimeout(function () { var p = document.getElementById('preloader'); if (p) p.remove(); }, 8000);</script>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
